name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy .

      - name: Check import contracts
        run: uv run lint-imports

      - name: Run tests with coverage
        run: uv run pytest --cov

  local-stack:
    name: Local stack starts healthy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Validate the compose file
        run: docker compose --env-file .env.example -f deploy/docker-compose.yml config --quiet

      - name: Start every service and wait for its healthcheck
        run: docker compose --env-file .env.example -f deploy/docker-compose.yml up --detach --wait --wait-timeout 300

      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file .env.example -f deploy/docker-compose.yml logs

      - name: Stop the stack
        if: always()
        run: docker compose --env-file .env.example -f deploy/docker-compose.yml down --volumes
