[project]
name = "proofpoint-rag"
version = "0.1.0"
description = "Multi-tenant RAG platform: answers grounded in the customer's documents, cited and scored."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "workers", "retrieval", "generation", "connectors", "eval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "S",     # flake8-bandit (security)
    "BLE",   # no blind except
    "A",     # builtins shadowing
    "C4",    # comprehensions
    "SIM",   # simplifications
    "PT",    # pytest style
    "ASYNC", # async pitfalls
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["api", "workers", "retrieval", "generation", "connectors", "eval"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.importlinter]
root_packages = ["api", "workers", "retrieval", "generation", "connectors", "eval"]

[[tool.importlinter.contracts]]
name = "Retrieval does not depend on generation"
type = "forbidden"
source_modules = ["retrieval"]
forbidden_modules = ["generation"]

[[tool.importlinter.contracts]]
name = "Connectors do not depend on generation (connectors never call the LLM)"
type = "forbidden"
source_modules = ["connectors"]
forbidden_modules = ["generation"]
